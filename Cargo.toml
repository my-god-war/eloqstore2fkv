[workspace]
resolver = "3"
members = ["crate/*/*", "tool/fkv_ledger"]
default-members = ["crate/compat/fkv_compat", "tool/fkv_ledger"]
exclude = ["cpp/build", ".data"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
publish = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
